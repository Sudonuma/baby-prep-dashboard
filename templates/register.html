<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account · Baby prep</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('babyTheme') || 'peach';</script>
  <link rel="stylesheet" href="/static/themes.css">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#d78379">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          blush: {
            50:'rgb(var(--b50) / <alpha-value>)',
            100:'rgb(var(--b100) / <alpha-value>)',
            200:'rgb(var(--b200) / <alpha-value>)',
            300:'rgb(var(--b300) / <alpha-value>)',
            400:'rgb(var(--b400) / <alpha-value>)',
            500:'rgb(var(--b500) / <alpha-value>)',
            600:'rgb(var(--b600) / <alpha-value>)',
            700:'rgb(var(--b700) / <alpha-value>)'
          },
          ink:'rgb(var(--ink) / <alpha-value>)',
          page:'rgb(var(--page) / <alpha-value>)'
        },
        boxShadow: { soft:'0 10px 30px rgba(var(--shadow-rgb), .07)' }
      }}
    }
  </script>
</head>
<body class="min-h-screen bg-page text-ink flex items-center justify-center px-4">
  <div class="w-full max-w-sm rounded-3xl border border-blush-100 bg-white p-8 shadow-soft">
    <div class="mb-2 flex items-center gap-2 text-sm font-semibold text-blush-600"><span class="h-2 w-2 rounded-full bg-blush-400"></span> NEST / BABY PREP</div>
    <h1 class="text-2xl font-semibold tracking-tight">Create your account</h1>
    <p class="mt-1 text-sm text-stone-500">Your own private dashboard for the baby prep.</p>
    {% if error %}<div class="mt-4 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700">{{ error }}</div>{% endif %}
    <form method="post" action="/register" class="mt-6 space-y-4">
      <div>
        <label class="text-xs font-semibold text-stone-500">Username</label>
        <input name="username" required autofocus class="mt-1 w-full rounded-xl border border-blush-200 bg-white px-3 py-2 text-sm outline-none transition focus:border-blush-400">
      </div>
      <div>
        <label class="text-xs font-semibold text-stone-500">Password (6+ characters)</label>
        <input type="password" name="password" required minlength="6" class="mt-1 w-full rounded-xl border border-blush-200 bg-white px-3 py-2 text-sm outline-none transition focus:border-blush-400">
      </div>
      <div>
        <label class="text-xs font-semibold text-stone-500">Repeat password</label>
        <input type="password" name="password2" required minlength="6" class="mt-1 w-full rounded-xl border border-blush-200 bg-white px-3 py-2 text-sm outline-none transition focus:border-blush-400">
      </div>
      <div>
        <label class="text-xs font-semibold text-stone-500">Email (optional, for password recovery)</label>
        <input type="email" name="email" placeholder="you@example.com" class="mt-1 w-full rounded-xl border border-blush-200 bg-white px-3 py-2 text-sm outline-none transition focus:border-blush-400">
        <p class="mt-1 text-xs text-stone-400">Only used to send a reset link if you ever forget your password.</p>
      </div>
      <button class="w-full rounded-xl bg-blush-500 py-2.5 text-sm font-semibold text-white transition hover:bg-blush-600">Create account</button>
    </form>
    <p class="mt-4 text-center text-sm text-stone-500">Already have one? <a href="/login" class="font-semibold text-blush-600">Log in</a></p>
  </div>
</body>
</html>
